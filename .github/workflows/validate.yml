name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Home Assistant hassfest
        uses: home-assistant/actions/hassfest@master

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Home Assistant Marketplace / HACS compatibility
        uses: hacs/action@main
        with:
          category: integration
