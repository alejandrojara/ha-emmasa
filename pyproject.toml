[project]
name = "ha-emmasa"
version = "20261125"
description = "Home Assistant custom integration for EMMASA Portal Ciudadano (Elliot Cloud)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --cov=custom_components/emmasa --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["custom_components/emmasa"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = []

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ASYNC",
    "RUF",
    "PTH",
    "TID",
    "TRY",
    "PERF",
    "D",
]
ignore = [
    "D100",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "E501",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "TRY003"]
